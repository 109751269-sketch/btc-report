<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTC 周报 · 目录</title>
<style>
:root{
  --bg:#080a0f; --panel:#11161f; --panel2:#151b26;
  --line:#1f2836; --line2:#2a3546;
  --txt:#e8edf5; --txt2:#9aa7bb; --txt3:#67748a;
  --acc:#f0b429; --acc2:#5b9dff; --up:#3ddc97;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  line-height:1.7; -webkit-font-smoothing:antialiased;
  min-height:100vh;
  background-image:
    radial-gradient(900px 460px at 12% -8%,rgba(91,157,255,.12),transparent 62%),
    radial-gradient(760px 400px at 88% 4%,rgba(240,180,41,.07),transparent 66%);
}
.wrap{max-width:880px;margin:0 auto;padding:0 24px}
header{padding:72px 0 44px;border-bottom:1px solid var(--line)}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--acc);border:1px solid rgba(240,180,41,.28);
  background:rgba(240,180,41,.07);padding:6px 14px;border-radius:99px;
  margin-bottom:22px;font-weight:600;
}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc)}
h1{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
h1 .grad{
  background:linear-gradient(100deg,#fff,#9fc4ff 45%,#f0b429 85%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.lede{color:var(--txt2);font-size:15px}
main{padding:36px 0 80px}
h2{
  font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--txt3);font-weight:600;margin-bottom:18px;
}
ul{list-style:none}
li{margin-bottom:12px}
a.card{
  display:flex;align-items:center;gap:18px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:20px 22px;text-decoration:none;color:inherit;
  transition:border-color .18s ease,transform .18s ease,background .18s ease;
}
a.card:hover{
  border-color:var(--line2);background:var(--panel2);transform:translateY(-2px);
}
.date{
  font-family:var(--mono);font-size:13px;color:var(--acc);
  flex:none;padding:4px 10px;border-radius:7px;
  background:rgba(240,180,41,.09);border:1px solid rgba(240,180,41,.22);
}
.meta{flex:1;min-width:0}
.title{font-size:16px;font-weight:600;margin-bottom:3px}
.sub{font-size:13px;color:var(--txt2)}
.arrow{color:var(--txt3);font-size:18px;flex:none;transition:transform .18s ease,color .18s ease}
a.card:hover .arrow{transform:translateX(4px);color:var(--acc)}
.latest{
  display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;
  color:var(--up);border:1px solid rgba(61,220,151,.3);
  background:rgba(61,220,151,.08);padding:2px 8px;border-radius:5px;
  margin-left:8px;vertical-align:2px;
}
footer{
  border-top:1px solid var(--line);padding:24px 0 48px;
  font-size:12px;color:var(--txt3);font-family:var(--mono);
}
@media(max-width:560px){
  a.card{gap:12px;padding:16px}
  .date{font-size:11px;padding:3px 8px}
  .title{font-size:15px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow"><span class="dot"></span>BTC Research</div>
    <h1>BTC 指标、周期与位置<span class="grad"> 周报</span></h1>
    <p class="lede">全维度实证报告按期归档。每期独立成页，链接永久有效。</p>
  </header>
  <main>
    <h2>报告归档</h2>
    <ul>
      <li>
        <a class="card" href="./2026-11-11/">
          <span class="date">2026-11-11</span>
          <span class="meta">
            <span class="title">推特 BTC 博主预测能力评测<span class="latest">最新</span></span>
            <span class="sub">87 个博主 · 341 条预测 · 基准校正 · 模拟操作 · 稳健性分层</span>
          </span>
          <span class="arrow">→</span>
        </a>
      </li>
      <li>
        <a class="card" href="./2026-11-08/">
          <span class="date">2026-11-08</span>
          <span class="meta">
            <span class="title">数据截至 2026-11-06</span>
            <span class="sub">指标 · 周期 · 位置 · 衍生品 · 宏观 · 风险计划</span>
          </span>
          <span class="arrow">→</span>
        </a>
      </li>
    </ul>
  </main>
  <footer>Generated weekly · 新建目录 + index.html + git push 即可发布新一期</footer>
</div>
</body>
</html>
